version: '3.9'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./backend:/app
      - ./db:/app/db
      - ./model:/app/model
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  redis_data: